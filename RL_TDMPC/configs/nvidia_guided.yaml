# NVIDIA XCATH centerline-guided training backend. The local defaults are only
# path conveniences; the environment factory/CLI may override both paths.
backend: nvidia-guided
safety_cost_names:
  - contact_force
  - pre_penetration
  - containment_failure
  - clearance
  - curvature
  - tracking
safety_dim: 6

environment:
  workflow_root: /home/bizon/i4h-workflows
  ct_cache_path: /home/bizon/i4h_data/case01/cache
  max_episode_steps: 1200
  max_translation_velocity_m_s: 0.005
  max_rotation_velocity_rad_s: 1.0
  terminate_on_hard_violation: true

model:
  latent_dim: 256
  enc_dim: 256
  mlp_dim: 256
  num_enc_layers: 2
  simnorm_dim: 8
  num_q: 5
  dropout: 0.01
  num_bins: 101
  vmin: -10.0
  vmax: 10.0
  log_std_min: -10.0
  log_std_max: 2.0

# NVIDIA already exposes normalized nonnegative channel costs. Every loss
# coefficient and transform scale is explicit; no scalar weights are inferred.
safety:
  loss_coef: 0.1
  channel_loss_coefs:
    contact_force: 1.0
    pre_penetration: 1.0
    containment_failure: 1.0
    clearance: 1.0
    curvature: 1.0
    tracking: 1.0
  channel_scales:
    contact_force: 1.0
    pre_penetration: 1.0
    containment_failure: 1.0
    clearance: 1.0
    curvature: 1.0
    tracking: 1.0
  primary_risk_channel: tracking

# First-pass training uses the guided baseline and does not activate a planner
# penalty. When evaluated later, tracking is the explicit primary risk channel.
safety_mpc:
  enabled: false
  alpha: 0.2
  translation_risk_cap: 1.0
  minimum_task_scale: 0.000001
  aggregation: max

diagnostics:
  validation_interval: 100
  gradient_interval: 100
  curvature_low_max_mm_inv: 0.05
  curvature_medium_max_mm_inv: 0.1
  curvature_high_max_mm_inv: 0.25

# The existing offline stEVE auxiliary dataset is schema-specific and remains
# disabled for the NVIDIA backend.
safety_aux:
  enabled: false
  dataset_path: null
  loss_coef: 1.0
  curvature_loss_coef: 1.0
  translation_loss_coef: 1.0
  translation_group_weights:
    none: 2.0
    lower_insertion_boundary: 1.0
    device_length_limit: 1.0
    vessel_tree_end: 1.0
    other: 1.0
  translation_zero_calibration_coef: 0.1
  validation_translation_threshold_candidates:
    - 0.0
    - 0.000001
    - 0.00001
    - 0.0001
    - 0.001
    - 0.002
    - 0.005
    - 0.01
    - 0.02
    - 0.05
    - 0.1
    - 0.2
    - 0.5
    - 1.0
  batch_size: 64
  update_interval: 1
  sampling_mode: mixed
  translation_fraction: 0.5
  curvature_fraction: 0.5
  sample_with_replacement: true

training:
  total_steps: 1000000
  seed_steps: 5000
  initial_updates: 5000
  updates_per_step: 1
  batch_size: 256
  replay_capacity: 1000000
  horizon: 3
  seed: 1
  device: auto
  lr: 0.0003
  enc_lr_scale: 0.3
  reward_coef: 0.1
  value_coef: 0.1
  termination_coef: 1.0
  consistency_coef: 20.0
  rho: 0.5
  grad_clip_norm: 20.0
  tau: 0.01
  discount_denom: 5.0
  discount_min: 0.95
  discount_max: 0.995
  entropy_coef: 0.0001
  episodic: true

planning:
  mpc: true
  horizon: 3
  iterations: 6
  num_samples: 512
  num_elites: 64
  num_pi_trajs: 24
  min_std: 0.05
  max_std: 2.0
  temperature: 0.5

logging:
  directory: logs/nvidia_guided
  update_interval: 100

checkpoint:
  directory: checkpoints/nvidia_guided
  interval: 10000
  save_replay: true
  save_final: true

evaluation:
  episodes: 10
  seed: 1000
  log_directory: logs/evaluation/nvidia_guided
